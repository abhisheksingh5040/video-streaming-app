# Basic properties
server.port=8080
spring.application.name=spring-stream-backend

# Connection properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/spring_video_stream?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root


# JPA properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect // No need in Java 17
spring.jpa.properties.hibernate.format_sql=true

# Maximum file size allowed for a single file upload
spring.servlet.multipart.max-file-size=1000MB

# Maximum file size allowed for a multipart/form-data requests
spring.servlet.multipart.max-request-size=1000MB

files.videos=videos/
